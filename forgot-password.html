<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — ELXO PromptPilot</title>
  <meta name="description" content="Reset your ELXO PromptPilot workspace account password.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/forgot-password.css">
</head>
<body class="bg-dark-foundation text-light min-vh-100 d-flex align-items-center justify-content-center py-5">

  <!-- 6-Layer Background -->
  <div class="aurora-container position-fixed w-100 h-100 top-0 start-0 pe-none z-0">
    <div class="cursor-spotlight" id="cursorSpotlight"></div>
    <div class="aurora-blob blob-purple parallax-layer" data-speed="0.4"></div>
    <div class="gradient-mesh-layer parallax-layer" data-speed="0.6"></div>
    <div class="aurora-blob blob-cyan parallax-layer" data-speed="1.1"></div>
    <div class="grid-overlay parallax-layer" data-speed="0.5"></div>
    <div class="noise-overlay"></div>
  </div>

  <main class="container position-relative z-1">
    <div class="auth-card glass-panel mx-auto p-4 p-sm-5 rounded-5 border border-subtle shadow-2xl max-w-500 reveal-item">
      
      <!-- Brand Header -->
      <div class="text-center mb-4">
        <a href="index.html" class="d-inline-flex align-items-center gap-2 mb-3 text-decoration-none" aria-label="PromptPilot Home">
          <div class="brand-icon-box">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#3B82F6" stroke-width="2"/>
              <path d="M2 17L12 22L22 17" stroke="#8B5CF6" stroke-width="2"/>
              <path d="M2 12L12 17L22 12" stroke="#06B6D4" stroke-width="2"/>
            </svg>
          </div>
          <span class="brand-text fs-4">ELXO <span class="brand-text-accent">PromptPilot</span></span>
        </a>
        <h1 class="fw-bold fs-4 text-light mb-1">Reset your password</h1>
        <p class="text-body-contrast fs-7 mb-0">Enter your registered work email and we'll send reset instructions.</p>
      </div>

      <!-- Success Alert Banner (Hidden by default) -->
      <div class="alert bg-success-subtle text-success border border-success rounded-3 fs-7 mb-4 d-none" id="resetSuccessAlert" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span>Password reset instructions sent! Check your inbox.</span>
      </div>

      <!-- Reset Form -->
      <form id="forgotForm" novalidate>
        <div class="mb-4">
          <label for="resetEmail" class="form-label font-mono fs-8 fw-bold text-body-contrast">WORK EMAIL</label>
          <div class="input-group">
            <span class="input-group-text bg-dark-soft border-subtle text-secondary-body"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control font-mono fs-7" id="resetEmail" placeholder="alex@company.com" required>
          </div>
          <div class="invalid-feedback font-mono fs-8 text-danger mt-1">Please enter your registered work email.</div>
        </div>

        <button type="submit" class="btn btn-glow-lg rounded-pill py-3 fw-semibold w-100 font-mono fs-7" id="btnResetSubmit">
          <span>Send Reset Link</span>
          <i class="bi bi-send-fill ms-2"></i>
        </button>
      </form>

      <!-- Auth Footer Link -->
      <div class="text-center mt-4 border-top border-subtle pt-3 fs-7 text-secondary-body">
        Remembered your password? <a href="login.html" class="text-cyan fw-bold text-decoration-none">Back to Sign In</a>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/script.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
