<!-- components/loading-state.html -->
<div class="d-flex flex-column align-items-center justify-content-center py-5 text-center font-mono w-100 max-w-700 mx-auto" id="appLoadingState" aria-label="Loading content" aria-busy="true">
  <div class="spinner-border text-cyan mb-3" role="status" style="width: 2.5rem; height: 2.5rem;">
    <span class="visually-hidden">Loading telemetry...</span>
  </div>
  <div class="text-light fw-bold fs-6 mb-3">Loading PromptPilot Studio Engine...</div>
  
  <!-- Premium Skeleton Loader Layout -->
  <div class="w-100 p-4 rounded-4 border border-subtle glass-card text-start">
    <div class="skeleton skeleton-title mb-3"></div>
    <div class="skeleton skeleton-text w-100 mb-2"></div>
    <div class="skeleton skeleton-text w-75 mb-3"></div>
    <div class="d-flex gap-2">
      <div class="skeleton skeleton-avatar" style="width: 32px; height: 32px;"></div>
      <div class="skeleton skeleton-text w-50 my-auto"></div>
    </div>
  </div>
</div>
